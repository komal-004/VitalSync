# VitalSync - Phase 2 Cloud Architecture
# Docker Compose: Apache Kafka (KRaft mode) + Kafka Web UI Dashboard
#
# To start Kafka:
#   docker-compose -f cloud/docker-compose.yml up -d
#
# To view the Kafka Web UI:
#   Open http://localhost:8085 in your browser

version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: vitalsync-kafka
    ports:
      - "9092:9092"
    environment:
      # Kafka in KRaft mode (no ZooKeeper required)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vitalsync-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: vitalsync-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
